server:
  port: ${PAYMENT_PORT:8064}

spring:
  rabbitmq:
    host: ${LOCAL_RABBITMQ_HOST:127.0.0.1}
    port: ${LOCAL_RABBITMQ_PORT:5672}
    username: ${LOCAL_RABBITMQ_USERNAME:guest}
    password: ${LOCAL_RABBITMQ_PASSWORD:guest}
    virtual-host: ${LOCAL_RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: false
      mandatory: true
    listener:
      simple:
        auto-startup: true
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: true
  application:
    name: ticket-payment-service
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:127.0.0.1}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: "${PAYMENT_DB_URL:jdbc:mysql://127.0.0.1:3306/ticket_payment?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true}"
    username: ${LOCAL_MYSQL_USERNAME}
    password: ${LOCAL_MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
  cloud:
    loadbalancer:
      retry:
        enabled: false
    nacos:
      config:
        # 激活nacos profile后再加载远程配置。
        enabled: false
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

ticket:
  http-resilience:
    order:
      enabled: ${PAYMENT_ORDER_RESILIENCE_ENABLED:true}
      concurrency: 20
  mq:
    enabled: ${TICKET_MQ_ENABLED:false}
    prefix: ${TICKET_MQ_PREFIX:ticket}
    retry-delays-ms: ${TICKET_MQ_RETRY_DELAYS_MS:10000,30000,120000}
  security:
    issuer: ${TICKET_TOKEN_ISSUER:ticket-auth-service}
    audience: ${TICKET_TOKEN_AUDIENCE:ticket-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://127.0.0.1:8065/.well-known/jwks.json}
    jwk-timeout: 3s
    redis-prefix: "ticket:auth:"
  payment-service-auth:
    order-payment-token: ${ORDER_PAYMENT_SERVICE_TOKEN:}
    credential-path: ${ORDER_PAYMENT_CREDENTIAL_PATH:.local/service-credentials/order-payment.token}
  service-auth:
    payment-order-token: ${PAYMENT_ORDER_SERVICE_TOKEN:}
    credential-path: ${PAYMENT_ORDER_CREDENTIAL_PATH:.local/service-credentials/payment-order.token}
  payment:
    # 仅在本地显式开启；模拟成功不代表接入真实支付渠道。
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:false}
    # 默认使用JWT；显式开启且本机直连、无Authorization时才接受开发用户头。
    dev-identity-enabled: ${PAYMENT_DEV_IDENTITY_ENABLED:false}
    notification:
      enabled: ${PAYMENT_NOTIFICATION_ENABLED:true}
      fixed-delay: ${PAYMENT_NOTIFICATION_FIXED_DELAY_MS:5000}
      service-id: ticket-order-service
      connect-timeout: ${ORDER_NOTIFICATION_CONNECT_TIMEOUT:2s}
      read-timeout: ${ORDER_NOTIFICATION_READ_TIMEOUT:10s}
      lease-duration: 30s
      batch-size: 20
      retry-base: 5s
      retry-max: 5m
# 保留标准 HTTP 追踪上下文；本机启动 Tempo 后再开启导出，避免无接收端时反复报错。
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TICKET_TRACING_SAMPLE_RATE:0.1}
    export:
      otlp:
        enabled: ${TICKET_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          transport: http
          endpoint: ${TICKET_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          connect-timeout: 2s
          timeout: 3s
