server:
  port: ${EVENT_PORT:8061}

spring:
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:127.0.0.1}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  application:
    name: ticket-event-service
  datasource:
    url: "${EVENT_DB_URL:jdbc:mysql://127.0.0.1:3306/ticket_event?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true}"
    username: ${LOCAL_MYSQL_USERNAME}
    password: ${LOCAL_MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

ticket:
  event-cache:
    enabled: ${EVENT_CACHE_ENABLED:true}
    prefix: "${EVENT_CACHE_PREFIX:ticket:{event-cache}:}"
    ttl-ms: 60000
    wait-ms: 1500
    lease-ms: 8000
    database-concurrency: 16
  event-service-auth:
    order-event-token: ${ORDER_EVENT_SERVICE_TOKEN:}
    credential-path: ${ORDER_EVENT_CREDENTIAL_PATH:.local/service-credentials/order-event.token}
  security:
    issuer: ${TICKET_TOKEN_ISSUER:ticket-auth-service}
    audience: ${TICKET_TOKEN_AUDIENCE:ticket-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://127.0.0.1:8065/.well-known/jwks.json}
    jwk-timeout: 3s
    redis-prefix: "ticket:auth:"
  inventory-init-auth:
    token: ${EVENT_INVENTORY_SERVICE_TOKEN:}
    credential-path: ${EVENT_INVENTORY_CREDENTIAL_PATH:.local/service-credentials/event-inventory.token}
  event-preparation:
    enabled: true
    fixed-delay: 2000
    service-id: ticket-inventory-service
    connect-timeout: 2s
    read-timeout: 3s
