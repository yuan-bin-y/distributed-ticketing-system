server:
  port: ${ORDER_PORT:8062}

spring:
  rabbitmq:
    host: ${LOCAL_RABBITMQ_HOST:127.0.0.1}
    port: ${LOCAL_RABBITMQ_PORT:5672}
    username: ${LOCAL_RABBITMQ_USERNAME:guest}
    password: ${LOCAL_RABBITMQ_PASSWORD:guest}
    virtual-host: ${LOCAL_RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      # MQ 通过 TraceSupport 恢复持久化父上下文，显式避免重复自动 Span。
      observation-enabled: false
      mandatory: true
    listener:
      simple:
        observation-enabled: false
        auto-startup: true
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: true
  application:
    name: ticket-order-service
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:127.0.0.1}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: "${ORDER_DB_URL:jdbc:mysql://127.0.0.1:3306/ticket_order?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true}"
    username: ${LOCAL_MYSQL_USERNAME}
    password: ${LOCAL_MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
  cloud:
    loadbalancer:
      retry:
        enabled: false
    nacos:
      config:
        # 激活nacos profile后再加载远程配置。
        enabled: false
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

ticket:
  http-resilience:
    inventory:
      enabled: ${ORDER_INVENTORY_RESILIENCE_ENABLED:true}
      concurrency: 20
    payment:
      enabled: ${ORDER_PAYMENT_RESILIENCE_ENABLED:true}
      concurrency: 20
  mq:
    enabled: ${TICKET_MQ_ENABLED:false}
    prefix: ${TICKET_MQ_PREFIX:ticket}
    retry-delays-ms: ${TICKET_MQ_RETRY_DELAYS_MS:10000,30000,120000}
  event-service-auth:
    order-event-token: ${ORDER_EVENT_SERVICE_TOKEN:}
    credential-path: ${ORDER_EVENT_CREDENTIAL_PATH:.local/service-credentials/order-event.token}
  inventory-service-auth:
    order-inventory-token: ${ORDER_INVENTORY_SERVICE_TOKEN:}
    credential-path: ${ORDER_INVENTORY_CREDENTIAL_PATH:.local/service-credentials/order-inventory.token}
  payment-service-auth:
    order-payment-token: ${ORDER_PAYMENT_SERVICE_TOKEN:}
    credential-path: ${ORDER_PAYMENT_CREDENTIAL_PATH:.local/service-credentials/order-payment.token}
  security:
    issuer: ${TICKET_TOKEN_ISSUER:ticket-auth-service}
    audience: ${TICKET_TOKEN_AUDIENCE:ticket-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://127.0.0.1:8065/.well-known/jwks.json}
    jwk-timeout: 3s
    redis-prefix: "ticket:auth:"
  service-auth:
    payment-order-token: ${PAYMENT_ORDER_SERVICE_TOKEN:}
    credential-path: ${PAYMENT_ORDER_CREDENTIAL_PATH:.local/service-credentials/payment-order.token}
  order:
    # 默认使用JWT。仅本机直连、显式开启且无Authorization时接受开发用户头。
    dev-identity-enabled: ${ORDER_DEV_IDENTITY_ENABLED:false}
    payment-window: ${ORDER_PAYMENT_WINDOW:15m}
    recovery-delay-ms: ${ORDER_RECOVERY_DELAY_MS:5000}
    recovery-enabled: ${ORDER_RECOVERY_ENABLED:true}
    batch-size: 20
    lease-duration: 60s
    retry-base: 5s
    retry-max: 5m
  clients:
    event:
      resilience:
        enabled: ${EVENT_RESILIENCE_ENABLED:true}
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        open-wait: 10s
        half-open-calls: 3
        half-open-max-wait: 10s
        max-concurrent-calls: 20
      service-id: ticket-event-service
      connect-timeout: ${EVENT_CLIENT_CONNECT_TIMEOUT:2s}
      read-timeout: ${EVENT_CLIENT_READ_TIMEOUT:5s}
    inventory:
      service-id: ticket-inventory-service
      connect-timeout: ${INVENTORY_CLIENT_CONNECT_TIMEOUT:2s}
      read-timeout: ${INVENTORY_CLIENT_READ_TIMEOUT:5s}
    payment:
      service-id: ticket-payment-service
      connect-timeout: ${PAYMENT_CLIENT_CONNECT_TIMEOUT:2s}
      read-timeout: ${PAYMENT_CLIENT_READ_TIMEOUT:5s}

# 保留标准 HTTP 追踪上下文；本机启动 Tempo 后再开启导出，避免无接收端时反复报错。
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TICKET_TRACING_SAMPLE_RATE:0.1}
    export:
      otlp:
        enabled: ${TICKET_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          transport: http
          endpoint: ${TICKET_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          connect-timeout: 2s
          timeout: 3s
