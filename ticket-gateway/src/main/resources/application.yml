server:
  forward-headers-strategy: none
  port: ${GATEWAY_PORT:8060}

spring:
  reactor:
    context-propagation: auto
  application:
    name: ticket-gateway
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:127.0.0.1}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    nacos:
      config:
        # 激活nacos profile后再加载远程配置。
        enabled: false
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          routes:
            - id: ticket-event-service
              # 按服务名发现实例，再由 LoadBalancer 选择转发目标。
              uri: lb://ticket-event-service
              predicates:
                - Path=/api/events/**,/api/admin/events/**
            - id: ticket-order-service
              uri: lb://ticket-order-service
              predicates:
                - Path=/api/orders/**
              metadata:
                # 下单串行查询活动、预留库存，临近到期时还会释放；为这些调用留出返回时间。
                # 单位为毫秒；依赖超时调整时同步检查此值，客户端超时后仍沿用原幂等键。
                response-timeout: ${ORDER_GATEWAY_RESPONSE_TIMEOUT_MS:30000}
            - id: ticket-payment-service
              uri: lb://ticket-payment-service
              predicates:
                - Path=/api/payments/**
            - id: ticket-auth-service
              uri: lb://ticket-auth-service
              predicates:
                - Path=/api/auth/**

ticket:
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    prefix: "${GATEWAY_RATE_LIMIT_PREFIX:ticket:{gateway-limit}:}"
    event-rate: 200
    event-burst: 400
    event-client-rate: 20
    event-client-burst: 40
    order-rate: 100
    order-burst: 200
    order-client-rate: 5
    order-client-burst: 10
  security:
    issuer: ${TICKET_TOKEN_ISSUER:ticket-auth-service}
    audience: ${TICKET_TOKEN_AUDIENCE:ticket-api}
    # 本地第一版使用Auth固定公钥地址；不是签发接口，也不读取私钥。
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://127.0.0.1:8065/.well-known/jwks.json}
    jwk-timeout: 3s
    redis-prefix: "ticket:auth:"

# 保留标准 HTTP 追踪上下文；本机启动 Tempo 后再开启导出，避免无接收端时反复报错。
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TICKET_TRACING_SAMPLE_RATE:0.1}
    export:
      otlp:
        enabled: ${TICKET_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          transport: http
          endpoint: ${TICKET_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          connect-timeout: 2s
          timeout: 3s
