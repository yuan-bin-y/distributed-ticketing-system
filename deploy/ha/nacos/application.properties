nacos.server.main.port=8848
nacos.console.port=8080
nacos.standalone=false
spring.sql.init.platform=mysql
spring.datasource.platform=mysql
db.num=1
db.url.0=jdbc:mysql://mysql-proxy1:3306,mysql-proxy2:3306/nacos?characterEncoding=utf8&connectTimeout=3000&socketTimeout=5000&useSSL=false
db.user.0=root
db.password.0=${HA_MYSQL_PASSWORD}
db.pool.config.maximumPoolSize=10
nacos.core.auth.enabled=true
nacos.core.auth.system.type=nacos
nacos.core.auth.admin.enabled=true
nacos.core.auth.console.enabled=true
nacos.core.api.compatibility.admin.enabled=true
nacos.core.auth.server.identity.key=ticketHaIdentity
nacos.core.auth.server.identity.value=${HA_NACOS_IDENTITY}
nacos.core.auth.plugin.nacos.token.secret.key=${HA_NACOS_TOKEN_SECRET}
