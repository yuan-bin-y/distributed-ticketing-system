global
    log stdout format raw local0
    external-check
    insecure-fork-wanted
defaults
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout check 3s
frontend mysql_write
    bind :3306
    default_backend mysql_primary
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
backend mysql_primary
    option external-check
    external-check command /usr/local/bin/check-primary
    default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server mysql1 mysql1:3306 check
    server mysql2 mysql2:3306 check
    server mysql3 mysql3:3306 check
