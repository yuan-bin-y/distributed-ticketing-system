global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ticket-services
    metrics_path: /actuator/prometheus
    # Docker DNS返回各副本IP，分别抓取Order两个实例，避免只随机抓到一个副本。
    dns_sd_configs:
      - names: [auth, event, order, inventory, payment, gateway]
        type: A
        port: 9000
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
      - source_labels: [service]
        target_label: application
        regex: (.*)
        replacement: ticket-$1-service
      - source_labels: [service]
        regex: gateway
        target_label: application
        replacement: ticket-gateway
