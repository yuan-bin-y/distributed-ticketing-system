# 独立本地开发栈，端口由Compose绑定回环；不复用本机Nacos数据库。
nacos.server.main.port=8848
nacos.console.port=8080
nacos.standalone=true
nacos.core.auth.enabled=false
nacos.core.auth.admin.enabled=false
nacos.core.auth.console.enabled=false
# 本地导入脚本兼容管理API；Java客户端使用gRPC接口。
nacos.core.api.compatibility.admin.enabled=true
# 鉴权关闭时的开发占位值，不是项目实际服务凭证。
nacos.core.auth.server.identity.key=ticketDockerLocal
nacos.core.auth.server.identity.value=local-development
