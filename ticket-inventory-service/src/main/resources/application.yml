server:
  port: ${INVENTORY_PORT:8063}

spring:
  application:
    name: ticket-inventory-service
  datasource:
    url: "${INVENTORY_DB_URL:jdbc:mysql://127.0.0.1:3306/ticket_inventory?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true}"
    username: ${LOCAL_MYSQL_USERNAME}
    password: ${LOCAL_MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
  cloud:
    nacos:
      config:
        # 激活nacos profile后再加载远程配置。
        enabled: false
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

ticket:
  inventory-service-auth:
    order-inventory-token: ${ORDER_INVENTORY_SERVICE_TOKEN:}
    credential-path: ${ORDER_INVENTORY_CREDENTIAL_PATH:.local/service-credentials/order-inventory.token}
  inventory-init-auth:
    token: ${EVENT_INVENTORY_SERVICE_TOKEN:}
    credential-path: ${EVENT_INVENTORY_CREDENTIAL_PATH:.local/service-credentials/event-inventory.token}
# 保留标准 HTTP 追踪上下文；本机启动 Tempo 后再开启导出，避免无接收端时反复报错。
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${TICKET_TRACING_SAMPLE_RATE:0.1}
    export:
      otlp:
        enabled: ${TICKET_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          transport: http
          endpoint: ${TICKET_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          connect-timeout: 2s
          timeout: 3s
